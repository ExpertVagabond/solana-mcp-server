name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Node 18 is EOL (April 2025) and cannot run this toolchain at all:
        # eslint ^10 declares engines ^20.19.0 || ^22.13.0 || >=24, and its
        # stylish formatter calls util.styleText, added in Node 20.12 —
        #   TypeError: util.styleText is not a function
        # so the lint step failed on 18 before reaching any of our code.
        node-version: [20, 22]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run lint
      run: npm run lint --if-present
    
    - name: Run type check
      run: npm run type-check --if-present
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Run build
      run: npm run build --if-present

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # A blanket `npm audit --audit-level moderate` can never pass here: every
    # advisory is transitive through @solana/web3.js v1 / @coral-xyz/anchor and
    # npm's only offered fix is a semver-major downgrade. The gate below fails
    # on anything NOT accepted in .github/audit-allowlist.json instead.
    - name: Run security audit
      run: node scripts/audit-gate.mjs

# Releasing lives in release.yml. A second semantic-release job here raced the
# first on every push to master, so it was removed rather than duplicated.
