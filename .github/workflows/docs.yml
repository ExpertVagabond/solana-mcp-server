name: Documentation

on:
  push:
    branches: [ main, master ]
    paths: ['docs/**', '*.md', 'src/**/*.ts', 'src/**/*.js', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '*.md', 'src/**/*.ts', 'src/**/*.js', '.github/workflows/docs.yml']

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate TypeDoc
      # Use the locally installed typedoc (devDependency) so it resolves the
      # repo's own TypeScript. A bare `npx typedoc` installs typedoc's newest
      # allowed peer (TypeScript 6.x), which rejects this tsconfig.
      # `--theme minimal` was removed from typedoc in 0.22 and is now an error.
      run: |
        if [ -f "tsconfig.json" ]; then
          npx --no-install typedoc --out docs/api src
        fi
    
    - name: Build docs site
      run: |
        if [ -f "docs/package.json" ]; then
          cd docs && npm ci && npm run build
        fi
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        force_orphan: true
