version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # TypeScript 7 has broken `npm ci` twice (9/04, 10/05): @typescript-eslint
    # still caps its peer at <6.1.0. Drop this once a release accepts TS 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "ExpertVagabond"
    assignees:
      - "ExpertVagabond"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "ExpertVagabond"
    assignees:
      - "ExpertVagabond"
    commit-message:
      prefix: "ci"
      include: "scope"
