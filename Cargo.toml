[package]
name = "solana-mcp-server"
version = "0.1.0"
edition = "2024"
description = "MCP server for Solana blockchain -- 25 tools for wallets, SOL/SPL transfers, token creation, minting, burning, freeze/thaw, delegation, network switching via Solana JSON-RPC"
license = "MIT"
authors = ["Purple Squirrel Media LLC"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
sha2 = "0.10"
